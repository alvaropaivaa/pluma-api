x-app: &app
  image: api-roxa:local
  pull_policy: never
  restart: unless-stopped
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - media:/data/media
  # tempo para passar os números para o outro container antes de desligar
  stop_grace_period: 120s
  healthcheck:
    test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 5s
    timeout: 4s
    start_period: 20s
    retries: 3

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: roxa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: api_roxa
    command: postgres -c shared_buffers=128MB -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roxa -d api_roxa']
      interval: 5s
      retries: 10

  # Dois containers iguais da API. No deploy um sai de cada vez e passa os números para o outro
  # (scripts/deploy.sh): a API não sai do ar e ninguém precisa ler QR de novo
  app_a:
    <<: *app
    build: .
    environment:
      NODE_NAME: a
      ADVERTISE_HOST: app_a

  app_b:
    <<: *app
    environment:
      NODE_NAME: b
      ADVERTISE_HOST: app_b

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Portas configuráveis: outro sistema pode estar usando 80/443 no mesmo servidor
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app_a
      - app_b

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
